name: stoa
description: "Collaborative file sharing and messaging application"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  
  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  intl: ^0.19.0
  
  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  
  # Navigation
  go_router: ^17.1.0
  
  # Local Storage
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  
  # Database (add later for Phase 4)
  # drift: ^2.22.1
  # sqlite3_flutter_libs: ^0.5.28
  
  # Network Discovery
  bonsoir: ^5.1.4
  
  # Encryption
  cryptography: ^2.7.0
  
  # CRDT & Sync
  crdt: ^5.0.0
  watcher: ^1.1.0
  crypto: ^3.0.3

  # Utils
  uuid: ^4.5.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  logger: ^2.5.0
  
  # File picking and handling
  file_picker: ^8.0.0
  open_filex: ^4.3.2
  mime: ^1.0.4

  # Database
  drift: ^2.14.0
  sqlite3_flutter_libs: ^0.5.18
  # path_provider is already included above
  path: ^1.9.0
  archive: ^4.0.9
  window_manager: ^0.5.1
  share_plus: ^12.0.1
  flutter_markdown: ^0.7.7+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  
  # Code generation
  build_runner: ^2.4.14
  drift_dev: ^2.14.0
  freezed: ^2.5.8
  json_serializable: ^6.9.4
  riverpod_generator: ^2.6.3

flutter:
  uses-material-design: true
  
  # Assets will be added later
  # assets:
  #   - assets/images/
  #   - assets/fonts/
