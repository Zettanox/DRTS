[package]
name = "stoa-node"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
bytes = "1.10"
ed25519-dalek = "2.2.0"
futures = "0.3.32"
iroh = { version = "0.97.0", features = ["address-lookup-mdns"] }
iroh-blobs = "0.99.0"
iroh-gossip = { version = "0.97.0", features = ["net"] }
n0-future = "0.1"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.51.0", features = ["full"] }
tokio-util = "0.7.18"
tracing = "0.1.44"


