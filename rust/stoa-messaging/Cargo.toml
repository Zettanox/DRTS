[package]
name = "stoa-messaging"
version = "0.1.0"
edition = "2024"

[dependencies]
stoa-node = { path = "../stoa-node" }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
iroh-gossip = "0.97.0"
iroh = "0.97.0"
tokio = { version = "1.51.0", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tracing = "0.1.44"
chrono = "0.4.38"
