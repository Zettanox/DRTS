[package]
name = "stoa"
version = "0.1.0"
description = "Stoa — Local-first decentralized collaboration"
authors = ["you"]
edition = "2021"

[lib]
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libp2p = { version = "0.56.0", features = ["mdns", "noise", "yamux", "tcp", "tokio", "macros", "ed25519"] }
tokio = { version = "1", features = ["full"] }
dirs = "6.0.0"
futures = "0.3"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
